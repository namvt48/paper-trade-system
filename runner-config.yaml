    strategy: cross_sectional
    version: "1"
    enabled: true
    params: {spec_file: 15m-blend-close/spec.json, universe_file: 15m-blend-close/data/universe.json, blacklist_file: 15m-blend-close/blacklist.txt, warmup_bars: 5760, retain_bars: 5760, capital: 10000.0, offset_candle_sec: 5.0, exchange: binance}
