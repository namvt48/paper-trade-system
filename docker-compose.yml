# Redis now lives in the central infra/redis stack on the external `redis-net`.
networks:
  redis-net:
    external: true

services:
  worker:
    build: ./worker
    env_file: ./worker/.env
    volumes:
      - ./data:/app/data
      - ./logs/worker:/app/logs
    environment:
      - REDIS_URL=redis://paper-redis:6379
      - MDS_REDIS_URL=${MDS_REDIS_URL:-redis://mds-redis:6379}
      - DB_PATH=/app/data/paper-trade.db
      - LOG_DIR=/app/logs
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SLIPPAGE_PCT=${SLIPPAGE_PCT:-0.05}
      - DUPLICATE_POSITION_POLICY=${DUPLICATE_POSITION_POLICY:-reject}
      - REGISTERED_ALPHAS=${REGISTERED_ALPHAS:-}
      - REDIS_READ_COUNT=${REDIS_READ_COUNT:-100}
      - REDIS_BLOCK_MS=${REDIS_BLOCK_MS:-1000}
      - SIGNAL_RETENTION_DAYS=${SIGNAL_RETENTION_DAYS:-0}
      - POSITION_SNAPSHOT_SYNC_INTERVAL_SEC=${POSITION_SNAPSHOT_SYNC_INTERVAL_SEC:-5}
      - POSITION_OWNERSHIP_GRACE_SEC=${POSITION_OWNERSHIP_GRACE_SEC:-30}
      - POSITION_OWNERSHIP_CHECK_INTERVAL_SEC=${POSITION_OWNERSHIP_CHECK_INTERVAL_SEC:-5}
      - ENABLE_POSITION_OWNERSHIP_MONITOR=${ENABLE_POSITION_OWNERSHIP_MONITOR:-true}
      - OPEN_BOOK_PRE_SUBSCRIBE_ENABLED=${OPEN_BOOK_PRE_SUBSCRIBE_ENABLED:-true}
      - OPEN_BOOK_READY_TIMEOUT_MS=${OPEN_BOOK_READY_TIMEOUT_MS:-750}
      - OPEN_BOOK_MAX_AGE_MS=${OPEN_BOOK_MAX_AGE_MS:-500}
      - EXECUTION_LATENCY_MODEL_ENABLED=${EXECUTION_LATENCY_MODEL_ENABLED:-false}
      - EXECUTION_LATENCY_MS=${EXECUTION_LATENCY_MS:-50}
      - EXECUTION_MIN_ADVERSE_BPS=${EXECUTION_MIN_ADVERSE_BPS:-0}
      - EXECUTION_SECOND_QUOTE_TIMEOUT_MS=${EXECUTION_SECOND_QUOTE_TIMEOUT_MS:-200}
    networks:
      - redis-net
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os,time; p='/tmp/bot_health'; exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p)<30 else 1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  web:
    build: ./web
    ports:
      - "${WEB_PORT:-8097}:3000"
    volumes:
      - ./data:/app/data
      - ./logs/web:/app/logs
      - ./alphas:/app/alphas:ro
    environment:
      - DB_PATH=/app/data/paper-trade.db
      - ALPHAS_DIR=/app/alphas
      - REDIS_URL=redis://paper-redis:6379
      - MDS_REDIS_URL=${MDS_REDIS_URL:-redis://mds-redis:6379}
      - HOSTNAME=0.0.0.0
      - PORT=3000
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DASHBOARD_CACHE_MS=${DASHBOARD_CACHE_MS:-1000}
      - TRADE_HISTORY_LIMIT=${TRADE_HISTORY_LIMIT:-200}
    command: sh -c "node server.js 2>&1 | tee -a /app/logs/web.log"
    networks:
      - redis-net
    restart: unless-stopped

  alpha-runner:
    build:
      context: ./alphas
      dockerfile: runner/Dockerfile
    environment:
      REDIS_URL: ${REDIS_URL:-redis://paper-redis:6379}
      MDS_REDIS_URL: ${MDS_REDIS_URL:-redis://mds-redis:6379}
      MDS_EXCHANGE: ${MDS_EXCHANGE:-binance}
      RUNNER_CONFIG: /config/runner-config.yaml
      RUNNER_ID: ${RUNNER_ID:-}
      RUNNER_METRICS_HOST: 0.0.0.0
      RUNNER_METRICS_PORT: 9091
    volumes:
      - ${RUNNER_CONFIG_FILE:-./runner-config.yaml}:/config/runner-config.yaml:ro
      - ./logs/runner:/app/logs
    networks:
      - redis-net
    restart: unless-stopped
    profiles:
      - runner

  shadow-worker:
    build:
      context: ./shadow-worker
    environment:
      REDIS_URL: ${REDIS_URL:-redis://paper-redis:6379}
      PRODUCTION_STREAM: paper-signals
      SHADOW_STREAM: paper-signals-shadow
      SHADOW_TTL_SEC: ${SHADOW_TTL_SEC:-300}
    networks:
      - redis-net
    restart: unless-stopped
    profiles:
      - shadow
