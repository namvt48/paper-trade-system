# Redis now lives in the central infra/redis stack on the external `redis-net`.
networks:
  redis-net:
    external: true

services:
  worker:
    build: ./worker
    env_file: ./worker/.env
    volumes:
      - ./data:/app/data
    environment:
      - REDIS_URL=redis://paper-redis:6379
      - MDS_REDIS_URL=${MDS_REDIS_URL:-redis://mds-redis:6379}
      - DB_PATH=/app/data/paper-trade.db
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SLIPPAGE_PCT=${SLIPPAGE_PCT:-0.05}
      - DUPLICATE_POSITION_POLICY=${DUPLICATE_POSITION_POLICY:-reject}
      - REGISTERED_ALPHAS=${REGISTERED_ALPHAS:-}
      - REDIS_READ_COUNT=${REDIS_READ_COUNT:-100}
      - REDIS_BLOCK_MS=${REDIS_BLOCK_MS:-1000}
      - VIRTUAL_TRADE_STREAM=${VIRTUAL_TRADE_STREAM:-paper-shadow-trades}
      - VIRTUAL_TRADE_CONSUMER_GROUP=${VIRTUAL_TRADE_CONSUMER_GROUP:-paper-shadow-ledger}
      - VIRTUAL_TRADE_CONSUMER_NAME=${VIRTUAL_TRADE_CONSUMER_NAME:-shadow-ledger-1}
      - SIGNAL_RETENTION_DAYS=${SIGNAL_RETENTION_DAYS:-0}
      - ENABLE_ORDERBOOK=${ENABLE_ORDERBOOK:-true}
      - ENABLE_ORDERBOOK_SLIPPAGE=${ENABLE_ORDERBOOK_SLIPPAGE:-true}
      - ORDERBOOK_SUPPORTED_EXCHANGES=${ORDERBOOK_SUPPORTED_EXCHANGES:-binance}
      - POSITION_SNAPSHOT_SYNC_INTERVAL_SEC=${POSITION_SNAPSHOT_SYNC_INTERVAL_SEC:-5}
      - POSITION_OWNERSHIP_GRACE_SEC=${POSITION_OWNERSHIP_GRACE_SEC:-30}
      - POSITION_OWNERSHIP_CHECK_INTERVAL_SEC=${POSITION_OWNERSHIP_CHECK_INTERVAL_SEC:-5}
      - ENABLE_POSITION_OWNERSHIP_MONITOR=${ENABLE_POSITION_OWNERSHIP_MONITOR:-true}
      - OPEN_BOOK_PRE_SUBSCRIBE_ENABLED=${OPEN_BOOK_PRE_SUBSCRIBE_ENABLED:-true}
      - OPEN_BOOK_READY_TIMEOUT_MS=${OPEN_BOOK_READY_TIMEOUT_MS:-750}
      - OPEN_BOOK_MAX_AGE_MS=${OPEN_BOOK_MAX_AGE_MS:-500}
      - EXECUTION_LATENCY_MODEL_ENABLED=${EXECUTION_LATENCY_MODEL_ENABLED:-false}
      - EXECUTION_LATENCY_MS=${EXECUTION_LATENCY_MS:-50}
      - EXECUTION_MIN_ADVERSE_BPS=${EXECUTION_MIN_ADVERSE_BPS:-0}
      - EXECUTION_SECOND_QUOTE_TIMEOUT_MS=${EXECUTION_SECOND_QUOTE_TIMEOUT_MS:-200}
      - ENABLE_EQUITY_SNAPSHOT=${ENABLE_EQUITY_SNAPSHOT:-true}
      - EQUITY_SNAPSHOT_INTERVAL_SEC=${EQUITY_SNAPSHOT_INTERVAL_SEC:-300}
      - EQUITY_SNAPSHOT_DB_PATH=/app/data/equity-snapshots.db
      - ALPHAS_DIR=/app/alphas
    networks:
      - redis-net
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os,time; p='/tmp/bot_health'; exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p)<30 else 1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  alpha-runner:
    build:
      context: ./
      dockerfile: alphas/runner/Dockerfile
    environment:
      REDIS_URL: ${REDIS_URL:-redis://paper-redis:6379}
      MDS_REDIS_URL: ${MDS_REDIS_URL:-redis://mds-redis:6379}
      MDS_EXCHANGE: ${MDS_EXCHANGE:-binance}
      RUNNER_CONFIG: /config/runner-config.yaml
      RUNNER_METRICS_HOST: 0.0.0.0
      RUNNER_METRICS_PORT: 9091
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MAX_ALPHAS_PER_RUNNER: ${MAX_ALPHAS_PER_RUNNER:-50}
      RUNNER_COMPUTE_WORKERS: ${RUNNER_COMPUTE_WORKERS:-8}
      CLAIM_INTERVAL_SEC: ${CLAIM_INTERVAL_SEC:-30}
      RUNNER_CACHE_DIR: ${RUNNER_CACHE_DIR:-/data/cache}
    volumes:
      - ${RUNNER_CONFIG_FILE:-./runner-config.yaml}:/config/runner-config.yaml:ro
      - ../market-data-service/historical_cache:${RUNNER_CACHE_DIR:-/data/cache}:ro
    depends_on:
      - worker
    networks:
      - redis-net
    restart: unless-stopped
    profiles:
      - runner
    deploy:
      replicas: ${RUNNER_REPLICAS:-1}

  alpha-runner-legacy:
    build:
      context: ./
      dockerfile: alphas/runner/Dockerfile
    environment:
      REDIS_URL: ${REDIS_URL:-redis://paper-redis:6379}
      MDS_REDIS_URL: ${MDS_REDIS_URL:-redis://mds-redis:6379}
      MDS_EXCHANGE: ${MDS_EXCHANGE:-binance}
      RUNNER_ID: paper-runner-legacy-standalone
      RUNNER_CONFIG: /config/runner-config.yaml
      RUNNER_METRICS_HOST: 0.0.0.0
      RUNNER_METRICS_PORT: 9092
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MAX_ALPHAS_PER_RUNNER: ${LEGACY_MAX_ALPHAS_PER_RUNNER:-12}
      RUNNER_COMPUTE_WORKERS: ${LEGACY_RUNNER_COMPUTE_WORKERS:-4}
      CLAIM_INTERVAL_SEC: ${LEGACY_CLAIM_INTERVAL_SEC:-3600}
      RUNNER_CACHE_DIR: ${RUNNER_CACHE_DIR:-/data/cache}
    volumes:
      - ${LEGACY_RUNNER_CONFIG_FILE:-./runner-config-legacy.yaml}:/config/runner-config.yaml:ro
      - ../market-data-service/historical_cache:${RUNNER_CACHE_DIR:-/data/cache}:ro
    depends_on:
      - worker
    networks:
      - redis-net
    restart: unless-stopped
    profiles:
      - runner
    deploy:
      replicas: ${LEGACY_RUNNER_REPLICAS:-1}

  pm-live:
    build:
      context: ./
      dockerfile: portfolio_manager/Dockerfile
    environment:
      REDIS_URL: ${REDIS_URL:-redis://paper-redis:6379}
      MDS_REDIS_URL: ${MDS_REDIS_URL:-redis://mds-redis:6379}
      PORTFOLIO_CONFIG: /app/portfolio_manager/config/portfolio.json
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      - worker
    networks:
      - redis-net
    restart: unless-stopped
    profiles:
      - pm
