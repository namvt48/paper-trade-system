networks:
  paper-trade:
    name: paper-trade
  market-data:
    external: true

services:
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6382}:6379"
    volumes:
      - redis_data:/data
      - ./logs/redis:/logs
    command: sh -c "touch /logs/redis.log && chmod 0644 /logs/redis.log && redis-server --appendonly yes 2>&1 | tee -a /logs/redis.log"
    networks:
      paper-trade:
        aliases:
          - paper-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build: ./worker
    depends_on:
      redis:
        condition: service_healthy
    env_file: ./worker/.env
    volumes:
      - ./data:/app/data
      - ./logs/worker:/app/logs
    environment:
      - REDIS_URL=redis://paper-redis:6379
      - MDS_REDIS_URL=${MDS_REDIS_URL:-redis://mds-redis:6379}
      - DB_PATH=/app/data/paper-trade.db
      - LOG_DIR=/app/logs
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SLIPPAGE_PCT=${SLIPPAGE_PCT:-0.05}
      - DUPLICATE_POSITION_POLICY=${DUPLICATE_POSITION_POLICY:-reject}
      - REGISTERED_ALPHAS=${REGISTERED_ALPHAS:-}
      - REDIS_READ_COUNT=${REDIS_READ_COUNT:-100}
      - REDIS_BLOCK_MS=${REDIS_BLOCK_MS:-1000}
      - SIGNAL_RETENTION_DAYS=${SIGNAL_RETENTION_DAYS:-0}
    networks:
      - paper-trade
      - market-data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os,time; p='/tmp/bot_health'; exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p)<30 else 1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  web:
    build: ./web
    ports:
      - "${WEB_PORT:-8097}:3000"
    depends_on:
      - redis
    volumes:
      - ./data:/app/data
      - ./logs/web:/app/logs
      - ./alphas:/app/alphas:ro
    environment:
      - DB_PATH=/app/data/paper-trade.db
      - ALPHAS_DIR=/app/alphas
      - REDIS_URL=redis://redis:6379
      - MDS_REDIS_URL=${MDS_REDIS_URL:-redis://mds-redis:6379}
      - HOSTNAME=0.0.0.0
      - PORT=3000
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DASHBOARD_CACHE_MS=${DASHBOARD_CACHE_MS:-1000}
      - TRADE_HISTORY_LIMIT=${TRADE_HISTORY_LIMIT:-200}
    command: sh -c "node server.js 2>&1 | tee -a /app/logs/web.log"
    networks:
      - paper-trade
      - market-data
    restart: unless-stopped

volumes:
  redis_data:
