runner:
  runner_id: paper-runner-production
  redis_url: redis://paper-redis:6379
  mds_redis_url: redis://mds-redis:6379
  mds_exchange: binance
  signal_stream: paper-signals
  shadow_mode: false
  warmup_min_symbol_coverage: 0.90
  data_queue_maxsize: 1000
  strategy_event_drop_warn_threshold: 100
  lease_ttl_sec: 20
  lease_renew_interval_sec: 5
  warmup:
    max_concurrent_mds_requests: 1
    max_mds_requests_per_minute: 6
    max_symbols_per_mds_request: 10
    request_timeout_sec: 180
    response_cache_ttl_sec: 300
  cache:
    min_retain_bars: 0

modules:
  - runner.strategies.cross_sectional
  - runner.strategies.hyper_turbo_v2
  - runner.strategies.v5_tail

alphas:
  - alpha_id: 15m-blend-close
    strategy: cross_sectional
    version: "1"
    enabled: true
    params:
      {
        spec_file: 15m-blend-close/spec.json,
        universe_file: 15m-blend-close/data/universe.json,
        blacklist_file: 15m-blend-close/blacklist.txt,
        warmup_bars: 5761,
        retain_bars: 5761,
        capital: 10000.0,
        offset_candle_sec: 5.0,
