networks:
  redis-net:
    external: true

services:
  adx-trend-follow:
    build:
      context: ..
      dockerfile: adx-trend-follow/Dockerfile
    env_file: .env
    volumes:
      - ../../logs/alphas/adx-trend-follow:/app/logs
    environment:
      - REDIS_URL=redis://paper-redis:6379
      - MDS_REDIS_URL=${MDS_REDIS_URL:-redis://mds-redis:6379}
      - LOG_DIR=/app/logs
      - DATA_CHANNELS=kline:15m
    networks:
      - redis-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os; exit(0 if os.path.exists('/tmp/bot_health') else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
