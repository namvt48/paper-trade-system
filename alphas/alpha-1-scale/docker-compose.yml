networks:
  paper-trade:
    external: true

services:
  alpha-1-scale:
    build:
      context: ..
      dockerfile: alpha-1-scale/Dockerfile
    env_file: .env
    volumes:
      - ../../logs/alphas/alpha-1-scale:/app/logs
      - ./blacklist.txt:/app/blacklist.txt:ro
      - ./data:/app/data:ro
    environment:
      - REDIS_URL=redis://redis:6379
      - LOG_DIR=/app/logs
      - DATA_CHANNELS=kline:1h
    networks:
      - paper-trade
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os; exit(0 if os.path.exists('/tmp/bot_health') else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
