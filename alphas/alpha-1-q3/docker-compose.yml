networks:
  paper-trade:
    external: true
  market-data:
    external: true

services:
  alpha-1-q3:
    build:
      context: ..
      dockerfile: alpha-1-q3/Dockerfile
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../../logs/alphas/alpha-1-q3:/app/logs
      - ./blacklist.txt:/app/blacklist.txt:ro
      - ./data:/app/data:ro
      - ./config.toml:/app/config.toml:ro
    environment:
      - REDIS_URL=redis://paper-redis:6379
      - LOG_DIR=/app/logs
      - MDS_REDIS_URL=${MDS_REDIS_URL:-redis://mds-redis:6379}
      - MDS_EXCHANGE=${MDS_EXCHANGE:-binance}
    networks:
      - paper-trade
      - market-data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os; exit(0 if os.path.exists('/tmp/bot_health') else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
