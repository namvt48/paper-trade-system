networks:
  redis-net:
    external: true

services:
  wilder:
    build:
      context: ..
      dockerfile: wilder/Dockerfile
    env_file: .env
    volumes:
      - ../../logs/alphas/wilder:/app/logs
    environment:
      - REDIS_URL=redis://paper-redis:6379
      - MDS_REDIS_URL=${MDS_REDIS_URL:-redis://mds-redis:6379}
      - MDS_EXCHANGE=${MDS_EXCHANGE:-binance}
      - LOG_DIR=/app/logs
      - DATA_CHANNELS=kline:1h
    networks:
      - redis-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time; p='/tmp/bot_health'; exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p)<30 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
